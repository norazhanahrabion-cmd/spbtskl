<style>
/* Rak buku: setiap tahun ada warna kulit buku sendiri; latar sejuk, aksen laut */
:root{
  --bg:#eef3f4;--card:#ffffff;--ink:#12262b;--mut:#5d7278;--line:#d9e3e5;
  --g:#0b7a75;--g2:#e1f2f0;--gi:#ffffff;
  --warn:#a4560a;--warnbg:#fdf1de;--bad:#b42318;
  --y1:#e4572e;--y2:#e9a200;--y3:#2f9e66;--y4:#1f7ac4;--y5:#6a4fc4;--y6:#c2417a;--yc:var(--g);
  --sh:0 1px 2px rgba(18,38,43,.06),0 6px 18px rgba(18,38,43,.06);
  --r:16px;--fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d181b;--card:#15252a;--ink:#e6f0f1;--mut:#8ea5aa;--line:#24383d;--g:#3fc7bf;--g2:#143536;--gi:#062321;--warn:#f0b35c;--warnbg:#33281a;--bad:#ff8a7a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d181b;--card:#15252a;--ink:#e6f0f1;--mut:#8ea5aa;--line:#24383d;--g:#3fc7bf;--g2:#143536;--gi:#062321;--warn:#f0b35c;--warnbg:#33281a;--bad:#ff8a7a;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
body[data-y="1"]{--yc:var(--y1)}body[data-y="2"]{--yc:var(--y2)}body[data-y="3"]{--yc:var(--y3)}body[data-y="4"]{--yc:var(--y4)}body[data-y="5"]{--yc:var(--y5)}body[data-y="6"]{--yc:var(--y6)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
button,select{font-family:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mark{flex:0 0 38px;height:38px;border-radius:11px;background:var(--yc);display:grid;place-items:center;transition:background .25s}
.mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header h1{flex:1;min-width:0;margin:0;font:700 19px/1.15 var(--fd);letter-spacing:-.01em}
header h1 small{display:block;margin-top:2px;font:500 12.5px/1.3 var(--fb);color:var(--mut);letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--g)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--g);border-color:var(--g);color:var(--gi)}
header .btn{padding:8px 14px}
main{max-width:1000px;margin:0 auto;padding:18px 16px 96px}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:14px}
.hero{display:grid;gap:14px;margin:4px 0 22px}
.hero h2{margin:0;font:800 clamp(26px,5vw,38px)/1.05 var(--fd);letter-spacing:-.02em;text-wrap:balance;color:var(--ink)}
.hero p{margin:0;color:var(--mut);max-width:60ch}
.meter{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;display:grid;gap:8px}
.meter .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.meter b{font:800 26px/1 var(--fd);font-variant-numeric:tabular-nums}.meter span{color:var(--mut);font-size:14px}
.meter .bar{height:10px}
h2.yr{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font:700 17px/1 var(--fd)}
h2.yr::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--yc)}
h2.yr span{margin-left:auto;font:500 13px var(--fb);color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.tile{position:relative;display:grid;gap:3px;text-align:left;padding:14px 14px 14px 22px;background:var(--card);color:var(--ink);border:0;border-radius:6px var(--r) var(--r) 6px;box-shadow:var(--sh);cursor:pointer;font:inherit;overflow:hidden;transition:transform .15s,box-shadow .15s}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:var(--yc)}
.tile:hover{transform:translateY(-2px)}.tile:active{transform:scale(.98)}
.tile .tl{font:500 12.5px var(--fb);color:var(--mut)}
.tile b{font:800 22px/1.05 var(--fd);letter-spacing:-.01em}
.tile .tg{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tp{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.off{opacity:.55;cursor:default;box-shadow:none;border:1px dashed var(--line);background:transparent}
.tile.off:hover{transform:none}
.bar{height:7px;background:var(--g2);border-radius:99px;overflow:hidden;margin:7px 0 3px}
.bar i{display:block;height:100%;width:0;background:var(--yc);border-radius:99px;transition:width .4s}
.meter .bar i{background:var(--g)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.stat{flex:1 1 90px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px 14px}
.stat b{display:block;font:800 22px/1.1 var(--fd);font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--mut)}
.stat.w{flex:1 1 100%}
.tabs{display:flex;gap:4px;margin:4px 0 14px;background:var(--g2);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 6px;border-radius:11px;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.chip small{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:99px;background:var(--g2);color:var(--g);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chip.on{background:var(--yc);border-color:var(--yc);color:#fff}
.chip.on small{background:rgba(255,255,255,.25);color:#fff}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;user-select:none;border:1.5px solid transparent;box-shadow:var(--sh);transition:background .15s,border-color .15s}
.row:active{transform:scale(.99)}
.row.on{background:var(--g2);border-color:var(--g)}
.box{flex:0 0 30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;font-size:17px;transition:background .15s,border-color .15s}
.row.on .box{background:var(--g);border-color:var(--g);color:var(--gi);animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.no{flex:0 0 26px;width:26px;text-align:right;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.nm{flex:1;min-width:0;font-size:15px;font-weight:500}
.nb{font-size:12px;color:var(--mut);font-weight:600}
.row.lock{opacity:.5;cursor:not-allowed;box-shadow:none;background:repeating-linear-gradient(135deg,transparent 0 7px,var(--g2) 7px 14px)}
.cn{display:inline-block;font-size:11px;font-weight:700;background:#fde4e1;color:#b42318;border-radius:6px;padding:1px 7px;margin-left:5px;vertical-align:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cn{background:#4a1f1b;color:#ffb4a8}}
:root[data-theme="dark"] .cn{background:#4a1f1b;color:#ffb4a8}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .sp{flex:1}.cnt{font-size:14px;color:var(--mut)}.cnt b{color:var(--ink);font-variant-numeric:tabular-nums}
.gbox{display:flex;align-items:center;gap:10px;margin:0 0 12px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:6px 14px}
.gbox label{font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.gbox select{flex:1;min-width:0;font-size:15px;font-weight:600;border:0;background:transparent;color:var(--ink);padding:10px 0}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-bottom:8px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.card .bd{display:none;padding:2px 12px 12px;border-top:1px solid var(--line);background:var(--bg)}
.card.open .bd{display:block}
.card .bd .row{box-shadow:none;border-color:var(--line)}.card .bd .row.on{border-color:var(--g)}
.pill{font-size:12.5px;font-weight:700;background:var(--g2);color:var(--g);padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border-radius:14px;background:var(--card);box-shadow:var(--sh);max-height:70vh}
table{border-collapse:separate;border-spacing:0;font-size:13px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
th{position:sticky;top:0;background:var(--g2);z-index:2;height:150px;min-width:40px;vertical-align:bottom}
th div{writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 4px;max-height:150px;font-weight:600;white-space:nowrap;margin:0 auto}
td.n{position:sticky;left:0;background:var(--card);text-align:left;padding:6px 10px;min-width:210px;max-width:210px;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.n{left:0;z-index:3;min-width:210px;vertical-align:bottom;text-align:left;padding:8px 10px}
.cell{width:40px;height:36px;cursor:pointer;font-weight:800;color:transparent;transition:background .12s}
.cell.on{background:var(--g);color:var(--gi)}
.cell.lockc{background:var(--g2);color:var(--mut);cursor:not-allowed}
.save{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;box-shadow:var(--sh)}
.save.show{opacity:.96}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:12px/1.4 ui-monospace,monospace;padding:10px}
table.sum{width:100%;background:var(--card);border-radius:14px;overflow:hidden}
table.sum th,table.sum td{height:auto;padding:10px 12px;text-align:left;position:static;background:transparent}
table.sum th{background:var(--g2);font-weight:700}
.tw table.sum{width:auto;min-width:100%}
h2{font:700 14px var(--fd);margin:22px 0 8px;color:var(--mut)}
.panel{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px;margin-bottom:12px;display:grid;gap:8px;border-left:6px solid var(--yc)}
.panel label{font-size:13px;font-weight:600;color:var(--mut)}
.panel input[type=text]{font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-transform:uppercase}
.panel label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px}
.panel label.chk input{width:20px;height:20px}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.hide{display:none!important}
</style>
</head>

    M.cols.forEach((col,bi)=>ws.str(ws.cell(col+sr),g.has(bi)?'/':null));
    ws.num(ws.cell(M.jn+sr), i<N?g.size:null);
    ws.cache(ws.cell('B'+sr), i<N?names[i]:'');
  });
  let prev=0;
  M.jrows.forEach(jr=>{
    let sub=0;
    M.cols.forEach((col,bi)=>{ let n=0; M.srows.forEach((sr,i)=>{ if(sr>prev&&sr<jr&&i<N&&got(i).has(bi)) n++; }); ws.num(ws.cell(col+jr),n); sub+=n; });
    ws.num(ws.cell(M.jn+jr),sub); prev=jr;
  });
  zip.file(M.nl,xOut(nl.d)); zip.file(M.form,xOut(ws.d));
  return zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
}

      h+=`<tr><td>${tt}</td>${cells}<td style="text-align:center;font-weight:700">${rowTot}</td></tr>`;
    }
    h+=`<tr><th>Jumlah kurang</th>${colTot.map(v=>`<th style="text-align:center">${v}</th>`).join('')}<th style="text-align:center">${grand}</th></tr></tbody></table></div>`;
    const csv=['Kelas,Subjek,Perlu,Diterima,Kurang'].concat(shortRows().map(r=>`${r.c.label},"${r.b}",${r.need},${r.got},${r.kurang}`)).join('\n');
    h+=`<h2>SALIN DATA (semua kelas)</h2><textarea id="csv" readonly>${csv}</textarea><div class="toolbar" style="margin-top:8px"><button class="btn" id="cpy">Salin</button><span class="cnt" id="cpyMsg"></span></div>`;
  }
  const sy=window.scrollY; app.innerHTML=h;
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{view.stab=b.dataset.st;render()});
  app.querySelectorAll('[data-sy]').forEach(b=>b.onclick=()=>{view.syear=+b.dataset.sy;render()});
  const ba=$('#bAll'); if(ba) ba.onclick=downloadAllXlsx;
  const ss=$('#sSave'); if(ss) ss.onclick=()=>offer('Rumusan_kekurangan_buku_2027.csv','\ufeff'+$('#csv').value);
  const sp=$('#sPrint'); if(sp) sp.onclick=()=>openPrint('Rumusan_kekurangan_buku_2027_cetak.html',shortPrint());
  const cp=$('#cpy'); if(cp) cp.onclick=async()=>{ const ta=$('#csv'); ta.select(); try{ await navigator.clipboard.writeText(ta.value); $('#cpyMsg').textContent='Disalin ✓'; }catch(e){ $('#cpyMsg').textContent='Tekan lama pada kotak untuk salin'; } };
  window.scrollTo(0,sy);
}
$('#back').onclick=()=>{view={page:'home'};render();loadSumm()};
$('#sumBtn').onclick=enterSum;
render(); initDb();
</script>
</body>
</html>
